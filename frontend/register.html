<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — NeuraShield</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='neurashield.css') }}">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    #reg-bg { position:fixed; inset:0; z-index:0; pointer-events:none; }
    .login-wrap { position:relative;z-index:1;width:100%;max-width:440px;padding:20px; }
    .login-card {
      background:var(--ns-surface); border:1px solid var(--ns-border);
      border-radius:var(--ns-radius-xl); padding:40px; position:relative; overflow:hidden;
    }
    .login-card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background:linear-gradient(90deg, transparent, var(--ns-cyan), transparent);
    }
    .login-logo { display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;text-decoration:none; }
    .login-heading { text-align:center;font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px; }
    .login-sub { text-align:center;font-family:var(--ns-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ns-text-muted);margin-bottom:32px; }
    .ns-form-group { margin-bottom:18px; }
    .ns-label { display:block;font-family:var(--ns-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ns-text-muted);margin-bottom:8px; }
    .error-msg { padding:12px 16px;background:var(--ns-red-dim);border:1px solid rgba(255,59,59,0.3);border-radius:var(--ns-radius);font-family:var(--ns-mono);font-size:12px;color:var(--ns-red);margin-bottom:20px; }
    .login-footer-links { display:flex;justify-content:center;gap:20px;margin-top:24px;padding-top:20px;border-top:1px solid var(--ns-border); }
    .login-footer-links a { font-family:var(--ns-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ns-text-muted);text-decoration:none;transition:color 0.2s; }
    .login-footer-links a:hover { color:var(--ns-cyan); }
    .info-note { padding:12px 16px;background:var(--ns-cyan-dim);border:1px solid rgba(0,200,255,0.2);border-radius:var(--ns-radius);font-family:var(--ns-mono);font-size:11px;color:var(--ns-text-dim);margin-bottom:20px;line-height:1.5; }
  </style>
</head>
<body class="ns-grid-bg">
  <canvas id="reg-bg"></canvas>
  <div class="login-wrap">
    <a href="/" class="login-logo">
      <img src="{{ url_for('static', filename='static/ns_logo.png') }}"
           style="width:32px;height:32px;" alt="NeuraShield"
           onerror="this.style.display='none';">
      <div>
        <div class="ns-logo-name">NeuraShield</div>
        <div class="ns-logo-sub">Multi-Layer Threat Intelligence</div>
      </div>
    </a>
    <div class="login-card">
      <h1 class="login-heading">Create Account</h1>
      <p class="login-sub">Agent Registration</p>

      <div class="info-note">
        ℹ New accounts are created as Field Agent (User) access. Contact your system administrator for Commander (Admin) access.
      </div>

      {% if error %}
      <div class="error-msg">⚠ {{ error }}</div>
      {% endif %}

      <form method="POST" action="/register">
        <!-- Admin role hidden; always creates user account -->
        <input type="hidden" name="role" value="user">

        <div class="ns-form-group">
          <label class="ns-label" for="username">Agent ID (Username)</label>
          <input type="text" id="username" name="username"
                 class="ns-input" placeholder="Choose your agent ID" required autocomplete="username">
        </div>
        <div class="ns-form-group">
          <label class="ns-label" for="password">Access Code (Password)</label>
          <input type="password" id="password" name="password"
                 class="ns-input" placeholder="Set a strong access code" required autocomplete="new-password">
        </div>
        <div style="height:10px;"></div>
        <button type="submit" class="btn-primary btn-full" style="padding:14px;">
          <span class="btn-light"></span>
          Initialize Credentials <span class="btn-arrow">→</span>
        </button>
      </form>

      <div class="login-footer-links">
        <a href="/">← Back to Platform</a>
        <a href="/login">Already have an account?</a>
      </div>
    </div>
  </div>
  <script>
    (function(){
      const c=document.getElementById('reg-bg');const ctx=c.getContext('2d');let W,H;const pts=[];
      function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}resize();
      window.addEventListener('resize',resize,{passive:true});
      for(let i=0;i<30;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3});
      function frame(){ctx.clearRect(0,0,W,H);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;});
        for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(0,200,255,${.06*(1-d/120)})`;ctx.lineWidth=1;ctx.stroke();}}ctx.beginPath();ctx.arc(pts[i].x,pts[i].y,1.5,0,Math.PI*2);ctx.fillStyle='rgba(0,200,255,0.2)';ctx.fill();}requestAnimationFrame(frame);}frame();
    })();
  </script>
</body>
</html>
